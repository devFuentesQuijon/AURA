server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy del API hacia el contenedor backend (red interna de compose).
    # Con la IP fija en proxy_pass, nginx resuelve "backend" una sola vez al
    # arrancar y queda con la IP vieja si el backend se recrea; con resolver
    # + variable se re-resuelve por request contra el DNS embebido de Docker.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream "http://backend:8000";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 130s;  # el agente puede tardar hasta ~2 min
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
